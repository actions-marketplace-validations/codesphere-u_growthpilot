[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthpilot"
version = "1.2.0"
description = "Autonomous Zero-to-One Marketing, Technical SEO, GEO/AEO (llms.txt), CRO & Launch Engine with built-in MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "codesphere-u" }]
keywords = [
  "marketing-agent",
  "seo",
  "geo",
  "aeo",
  "llms-txt",
  "cro",
  "mcp-server",
  "agent-skills",
  "growth-engineering",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codesphere-u/growthpilot"
Repository = "https://github.com/codesphere-u/growthpilot"
Issues = "https://github.com/codesphere-u/growthpilot/issues"

[project.scripts]
growthpilot = "growthpilot:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
py-modules = ["growthpilot"]

[tool.setuptools.package-dir]
"" = "skills/growthpilot/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["skills/growthpilot/scripts/growthpilot.py"]
