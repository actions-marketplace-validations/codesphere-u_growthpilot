  <circle cx="1056" cy="122" r="46" fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" />
  <text x="1056" y="126" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="28" font-weight="800">100</text>
  <text x="1056" y="145" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">GRADE A+</text>
  <text x="1056" y="196" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="12" font-weight="600">SEO • GEO • Schema • CRO</text>
