  <path d="M84 82 L100 94 L84 118 L68 94 Z" fill="url(#accent)" opacity="0.22" />
  <path d="M73 111 L82 99 L90 105 L102 87" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M93 87 L102 87 L102 96" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

