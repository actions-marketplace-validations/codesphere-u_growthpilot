  <circle cx="72" cy="254" r="5" fill="#f43f5e" />
  <circle cx="90" cy="254" r="5" fill="#f59e0b" />
  <circle cx="108" cy="254" r="5" fill="#10b981" />
  <text x="132" y="259" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">$</text>
  <text x="150" y="259" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">uvx --from git+https://github.com/codesphere-u/growthpilot@v1 growthpilot https://yoursite.com --fix --open</text>
