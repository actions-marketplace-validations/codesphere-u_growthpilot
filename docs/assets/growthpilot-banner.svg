  <rect x="394" y="72" width="76" height="26" rx="13" fill="rgba(34,211,238,0.16)" stroke="#22d3ee" stroke-width="1" />
  <text x="432" y="89" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">v1.4.1</text>

