  <rect width="1200" height="320" rx="20" fill="url(#glowLeft)" />
  <rect width="1200" height="320" rx="20" fill="url(#glowRight)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5" />

  <!-- Top Accent Line -->
  <rect x="48" y="34" width="84" height="5" rx="2.5" fill="url(#accent)" />

  <!-- Left Icon Container -->
