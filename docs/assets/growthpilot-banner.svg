<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GrowthPilot — Autonomous Zero-to-One Marketing, SEO, GEO/AEO, CRO &amp; Launch Engine">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="52%" stop-color="#0c1528" />
      <stop offset="100%" stop-color="#13102c" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="28%" r="45%">
