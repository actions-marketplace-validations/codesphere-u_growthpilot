name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-audit:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies & run checks
        run: |
          rm -rf .venv
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]" pip-audit
          .venv/bin/ruff check .
          .venv/bin/mypy
          .venv/bin/pip-audit --skip-editable

      - name: Verify zero-install --demo & SARIF pipeline
        run: |
          python3 skills/growthpilot/scripts/growthpilot.py --demo --output-dir /tmp/gp-ci --sarif /tmp/gp-ci/growthpilot.sarif
          test -s /tmp/gp-ci/growthpilot-report.html
          test -s /tmp/gp-ci/LAUNCH_PLAYBOOK.md
          test -s /tmp/gp-ci/PROGRAMMATIC_SEO.md
          test -s /tmp/gp-ci/llms.txt
          test -s /tmp/gp-ci/growthpilot.sarif

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: |
          rm -rf .venv
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/pytest -v

  docker-smoke:
    name: Docker Build & Non-Root Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify non-root container
        run: |
          docker build -t growthpilot:ci .
          docker run --rm --user 10001 -v /tmp:/data growthpilot:ci --demo --output-dir /data/gp-out
          test -s /tmp/gp-out/growthpilot-report.html
          test -s /tmp/gp-out/LAUNCH_PLAYBOOK.md
